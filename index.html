<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डिजिटल सुमन 16</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      padding: 14px;
    }
    header {
      background: #1a73e8;
      color: white;
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.35rem; }
    header p { font-size: 0.85rem; opacity: 0.9; }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    .box h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: #1a73e8;
      text-align: center;
    }

    /* बटन और इनपुट */
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary {
      background: #4b5563;
    }
    .btn-outline {
      background: white;
      color: #1a73e8;
      border: 1.5px solid #1a73e8;
      padding: 8px 12px;
      font-size: 0.85rem;
      width: auto;
      margin-top: 0;
    }
    .btn:active {
      transform: scale(0.98);
    }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-top: 6px;
      margin-bottom: 12px;
      background: white;
    }
    textarea { height: 80px; resize: vertical; }

    /* सामग्री कार्ड */
    .item-card {
      background: white;
      border-left: 5px solid #1a73e8;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .tag {
      font-size: 0.72rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 6px;
      background: #e0e7ff;
      color: #3730a3;
    }
    .item-card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .item-card p { font-size: 0.9rem; color: #4b5563; line-height: 1.4; white-space: pre-wrap; }
    .item-card img { width: 100%; border-radius: 8px; margin-top: 8px; }
    
    .table-wrap {
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f8fafc; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: white;
      border-radius: 8px;
      font-weight: bold;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>डिजिटल सुमन 16</h1>
    <p>विद्यालय ई-पोर्टल</p>
  </header>

  <!-- 1. पहली स्क्रीन: स्टूडेंट या टीचर चुनें -->
  <div class="box" id="stepRole">
    <h2>आप कौन हैं?</h2>
    <button type="button" class="btn" onclick="goToStep('studentClass')">👨‍🎓 मैं छात्र / पालक हूँ (Student)</button>
    <button type="button" class="btn btn-secondary" onclick="goToStep('teacherLogin')">👩‍🏫 मैं शिक्षक हूँ (Teacher)</button>
  </div>

  <!-- 2. स्क्रीन (छात्र के लिए): क्लास सेलेक्ट करें -->
  <div class="box hidden" id="stepStudentClass">
    <h2>अपनी क्लास चुनें</h2>
    <label>कक्षा चुनिए:</label>
    <select id="studentClassSelect">
      <option value="" disabled selected>-- यहाँ दबाकर क्लास चुनें --</option>
      <option value="9th A">9th A</option>
      <option value="9th B">9th B</option>
      <option value="9th C">9th C</option>
      <option value="10th A">10th A</option>
      <option value="10th B">10th B</option>
      <option value="11th">11th</option>
      <option value="12th">12th</option>
    </select>
    <button type="button" class="btn" onclick="submitStudentClass()">पोर्टल खोलें</button>
    <button type="button" class="btn btn-secondary" onclick="goToStep('role')">← वापस</button>
  </div>

  <!-- 3. स्क्रीन (शिक्षक के लिए): गुप्त पिन दर्ज करें -->
  <div class="box hidden" id="stepTeacherLogin">
    <h2>शिक्षक सत्यापन</h2>
    <label>6 अंकों का गुप्त पिन दर्ज करें:</label>
    <input type="password" id="teacherPinInput" placeholder="पिन डालें" maxlength="6">
    <button type="button" class="btn" onclick="verifyTeacherPin()">लॉगिन करें</button>
    <button type="button" class="btn btn-secondary" onclick="goToStep('role')">← वापस</button>
  </div>

  <!-- 4. मुख्य छात्र पोर्टल (डेटा डिस्प्ले) -->
  <div class="hidden" id="studentPortal">
    <div class="top-bar">
      <span>🎓 कक्षा: <span id="displayStudentClass" style="color:#1a73e8;"></span></span>
      <button type="button" class="btn-outline" onclick="logout()">बदलें / बाहर निकलें</button>
    </div>

    <!-- समस्या / सलाह भेजने का फॉर्म -->
    <div class="box">
      <h3 style="font-size: 1rem; color:#1a73e8; margin-bottom:8px;">💬 शिक्षक को अपनी बात / समस्या भेजें</h3>
      <input type="text" id="fbName" placeholder="आपका नाम (चाहें तो खाली छोड़ें)">
      <textarea id="fbText" placeholder="अपनी समस्या या सलाह यहाँ लिखें..."></textarea>
      <button type="button" class="btn" onclick="sendFeedback()">संदेश भेजें</button>
    </div>

    <h2 style="font-size: 1.1rem; margin: 14px 4px 8px;">📚 स्कूल सामग्री (होमवर्क / सिलेबस / टाइम टेबल)</h2>
    <div id="postsContainer">लोड हो रहा है...</div>
  </div>

  <!-- 5. मुख्य शिक्षक पोर्टल -->
  <div class="hidden" id="teacherPortal">
    <div class="top-bar">
      <span>👩‍🏫 शिक्षक पैनल</span>
      <button type="button" class="btn-outline" onclick="logout()">लॉगआउट</button>
    </div>

    <!-- पोस्टिंग फ़ॉर्म -->
    <div class="box">
      <h2>नयी सामग्री पोस्ट करें</h2>
      <label>प्रकार:</label>
      <select id="postCat" onchange="toggleTTForm()">
        <option value="होमवर्क">होमवर्क (Homework)</option>
        <option value="सिलेबस">सिलेबस (Syllabus)</option>
        <option value="समय सारणी">समय सारणी (Timetable)</option>
        <option value="सूचना">सूचना (Notice)</option>
      </select>

      <label>कक्षा:</label>
      <select id="postClass">
        <option value="9th A">9th A</option>
        <option value="9th B">9th B</option>
        <option value="9th C">9th C</option>
        <option value="10th A">10th A</option>
        <option value="10th B">10th B</option>
        <option value="11th">11th</option>
        <option value="12th">12th</option>
        <option value="सभी कक्षाओं के लिए">सभी कक्षाओं के लिए</option>
      </select>

      <label>विषय / शीर्षक:</label>
      <input type="text" id="postTitle" placeholder="उदा. गणित या सामान्य सूचना">

      <!-- टाइम टेबल पंक्तियाँ -->
      <div id="ttSection" class="hidden">
        <label>समय सारणी (1. पीरियड | समय | विषय | शिक्षक):</label>
        <input type="text" id="ttRow1" placeholder="1 | 10:00-10:45 | गणित | शर्मा सर">
        <input type="text" id="ttRow2" placeholder="2 | 10:45-11:30 | विज्ञान | वर्मा सर">
        <input type="text" id="ttRow3" placeholder="3 | 11:30-12:15 | अंग्रेज़ी | जोशी सर">
      </div>

      <label>विवरण / निर्देश:</label>
      <textarea id="postDesc" placeholder="निर्देश यहाँ लिखें..."></textarea>

      <label>फ़ोटो या PDF जोड़ें (वैकल्पिक):</label>
      <input type="file" id="postFile" accept="image/*,application/pdf">

      <button type="button" class="btn" id="postBtn" onclick="savePost()">ऑनलाइन पोस्ट करें</button>
    </div>

    <!-- छात्रों की समस्याएँ -->
    <div class="box">
      <h2>📩 छात्रों की समस्याएँ एवं सलाह</h2>
      <div id="feedbacksContainer">लोड हो रहा है...</div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCUfzpo3_JTxMECkbRT",
      authDomain: "digital-suman-16.firebaseapp.com",
      projectId: "digital-suman-16",
      storageBucket: "digital-suman-16.firebasestorage.app",
      messagingSenderId: "9523225964",
      appId: "1:9523225964:web:8a6c393d",
      measurementId: "G-8WHH1SPEPY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeClass = localStorage.getItem("myClass") || "";
    let isTeacherAuth = false;
    let allPosts = [];

    // स्क्रीन नेविगेशन
    window.goToStep = function(step) {
      document.getElementById("stepRole").classList.add("hidden");
      document.getElementById("stepStudentClass").classList.add("hidden");
      document.getElementById("stepTeacherLogin").classList.add("hidden");
      document.getElementById("studentPortal").classList.add("hidden");
      document.getElementById("teacherPortal").classList.add("hidden");

      if (step === 'role') document.getElementById("stepRole").classList.remove("hidden");
      if (step === 'studentClass') document.getElementById("stepStudentClass").classList.remove("hidden");
      if (step === 'teacherLogin') document.getElementById("stepTeacherLogin").classList.remove("hidden");
      if (step === 'studentPortal') document.getElementById("studentPortal").classList.remove("hidden");
      if (step === 'teacherPortal') document.getElementById("teacherPortal").classList.remove("hidden");
    };

    window.submitStudentClass = function() {
      const cls = document.getElementById("studentClassSelect").value;
      if (!cls) {
        alert("कृपया लिस्ट में से क्लास चुनें!");
        return;
      }
      activeClass = cls;
      localStorage.setItem("myClass", cls);
      document.getElementById("displayStudentClass").innerText = cls;
      window.goToStep('studentPortal');
      renderPosts();
    };

    window.verifyTeacherPin = function() {
      const pin = document.getElementById("teacherPinInput").value;
      if (pin === "791632") {
        isTeacherAuth = true;
        window.goToStep('teacherPortal');
      } else {
        alert("गलत पिन! केवल शिक्षक ही लॉगिन कर सकते हैं।");
      }
    };

    window.logout = function() {
      localStorage.removeItem("myClass");
      activeClass = "";
      isTeacherAuth = false;
      document.getElementById("studentClassSelect").value = "";
      document.getElementById("teacherPinInput").value = "";
      window.goToStep('role');
    };

    window.toggleTTForm = function() {
      const cat = document.getElementById("postCat").value;
      const ttSec = document.getElementById("ttSection");
      if (cat === "समय सारणी") ttSec.classList.remove("hidden");
      else ttSec.classList.add("hidden");
    };

    // शिक्षक सामग्री पोस्ट करना
    window.savePost = async function() {
      const btn = document.getElementById("postBtn");
      const cat = document.getElementById("postCat").value;
      const cls = document.getElementById("postClass").value;
      const title = document.getElementById("postTitle").value.trim();
      const desc = document.getElementById("postDesc").value.trim();
      const fileInput = document.getElementById("postFile");

      if (!title) {
        alert("कृपया शीर्षक दर्ज करें!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "पोस्ट हो रहा है...";

      let ttArr = [];
      if (cat === "समय सारणी") {
        ["ttRow1", "ttRow2", "ttRow3"].forEach(id => {
          const val = document.getElementById(id).value.trim();
          if (val) {
            const parts = val.split("|");
            ttArr.push({
              period: parts[0]?.trim() || "",
              time: parts[1]?.trim() || "",
              sub: parts[2]?.trim() || "",
              teacher: parts[3]?.trim() || ""
            });
          }
        });
      }

      let fileData = "";
      let fileType = "";
      if (fileInput.files[0]) {
        const f = fileInput.files[0];
        fileType = f.type.includes("pdf") ? "pdf" : "image";
        fileData = await new Promise(res => {
          const r = new FileReader();
          r.onloadend = () => res(r.result);
          r.readAsDataURL(f);
        });
      }

      try {
        await addDoc(collection(db, "school_data"), {
          category: cat,
          classGrade: cls,
          title: title,
          description: desc,
          timetable: ttArr,
          fileData: fileData,
          fileType: fileType,
          createdAt: serverTimestamp()
        });
        alert("सफलतापूर्वक पोस्ट हो गया!");
        document.getElementById("postTitle").value = "";
        document.getElementById("postDesc").value = "";
        document.getElementById("postFile").value = "";
      } catch (err) {
        alert("त्रुटि: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "ऑनलाइन पोस्ट करें";
      }
    };

    // सामग्री स्क्रीन पर दिखाना
    function renderPosts() {
      const box = document.getElementById("postsContainer");
      if (!box) return;

      const filtered = allPosts.filter(p => p.classGrade === activeClass || p.classGrade === "सभी कक्षाओं के लिए");

      if (filtered.length === 0) {
        box.innerHTML = `<p style="text-align:center; padding:20px; color:#6b7280;">कक्षा ${activeClass} के लिए अभी कोई सामग्री नहीं है।</p>`;
        return;
      }

      box.innerHTML = "";
      filtered.forEach(p => {
        let ttHTML = "";
        if (p.timetable && p.timetable.length > 0) {
          ttHTML = `<div class="table-wrap"><table><tr><th>क्र.</th><th>समय</th><th>विषय</th><th>शिक्षक</th></tr>
            ${p.timetable.map(t => `<tr><td>${t.period}</td><td>${t.time}</td><td>${t.sub}</td><td>${t.teacher}</td></tr>`).join('')}
          </table></div>`;
        }

        let fileHTML = "";
        if (p.fileData) {
          if (p.fileType === "pdf") {
            fileHTML = `<a href="${p.fileData}" download="school.pdf" style="display:inline-block; margin-top:8px; padding:6px 12px; background:#dc2626; color:white; border-radius:6px; text-decoration:none; font-size:0.85rem;">📄 PDF डाउनलोड करें</a>`;
          } else {
            fileHTML = `<img src="${p.fileData}" alt="तस्वीर">`;
          }
        }

        const div = document.createElement("div");
        div.className = "item-card";
        div.innerHTML = `
          <span class="tag">${p.category} | ${p.classGrade}</span>
          <h3>${p.title}</h3>
          ${p.description ? `<p>${p.description}</p>` : ""}
          ${ttHTML}
          ${fileHTML}
          <div style="font-size:0.75rem; color:#9ca3af; margin-top:6px;">${p.date || ""}</div>
        `;
        box.appendChild(div);
      });
    }

    // छात्र संदेश भेजना
    window.sendFeedback = async function() {
      const name = document.getElementById("fbName").value.trim() || "गुमनाम";
      const text = document.getElementById("fbText").value.trim();
      if (!text) {
        alert("कृपया अपनी बात लिखें!");
        return;
      }
      try {
        await addDoc(collection(db, "student_feedbacks"), {
          studentName: name,
          classGrade: activeClass,
          message: text,
          createdAt: serverTimestamp()
        });
        alert("संदेश शिक्षक तक पहुँच गया!");
        document.getElementById("fbText").value = "";
      } catch (err) {
        alert("त्रुटि: " + err.message);
      }
    };

    // रीयलटाइम डेटाबेस लिसनर
    const qPosts = query(collection(db, "school_data"), orderBy("createdAt", "desc"));
    onSnapshot(qPosts, snap => {
      allPosts = [];
      snap.forEach(d => {
        const data = d.data();
        let dt = "";
        if (data.createdAt && data.createdAt.toDate) {
          dt = data.createdAt.toDate().toLocaleDateString("hi-IN", { day: 'numeric', month: 'short' });
        }
        allPosts.push({ id: d.id, ...data, date: dt });
      });
      if (activeClass) renderPosts();
    });

    const qFb = query(collection(db, "student_feedbacks"), orderBy("createdAt", "desc"));
    onSnapshot(qFb, snap => {
      const fbBox = document.getElementById("feedbacksContainer");
      if (!fbBox) return;
      if (snap.empty) {
        fbBox.innerHTML = "<p style='color:#6b7280;'>कोई संदेश नहीं है।</p>";
        return;
      }
      fbBox.innerHTML = "";
      snap.forEach(d => {
        const f = d.data();
        const card = document.createElement("div");
        card.style = "background:#f9fafb; padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid #e5e7eb;";
        card.innerHTML = `
          <div style="font-size:0.8rem; font-weight:bold; color:#1a73e8;">कक्षा: ${f.classGrade} | प्रेषक: ${f.studentName}</div>
          <p style="font-size:0.9rem; margin-top:4px;">${f.message}</p>
        `;
        fbBox.appendChild(card);
      });
    });

    // अगर पहले से क्लास चुनी है तो सीधे स्टूडेंट पोर्टल खोलें
    if (activeClass) {
      document.getElementById("displayStudentClass").innerText = activeClass;
      window.goToStep('studentPortal');
    } else {
      window.goToStep('role');
    }
  </script>
</body>
        </html>
