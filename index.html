<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डिजिटल सुमन 16 - होमवर्क पोर्टल</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 16px;
    }
    .header {
      background-color: #1a73e8;
      color: white;
      text-align: center;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .card h2 {
      margin-bottom: 15px;
      font-size: 1.25rem;
      color: #1a73e8;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #1557b0;
    }
    .homework-item {
      background: #ffffff;
      border-left: 5px solid #1a73e8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .homework-item h3 {
      font-size: 1.15rem;
      margin-bottom: 6px;
      color: #222;
    }
    .homework-item p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .homework-item img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: block;
    }
    .timestamp {
      font-size: 0.75rem;
      color: #888;
      margin-top: 8px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>डिजिटल सुमन 16</h1>
    <p>शिक्षक एवं छात्र होमवर्क पोर्टल</p>
  </div>

  <!-- होमवर्क पोस्ट करने का फॉर्म (शिक्षकों के लिए) -->
  <div class="card">
    <h2>नया होमवर्क जोड़ें</h2>
    <form id="homeworkForm">
      <div class="form-group">
        <label for="title">विषय / शीर्षक:</label>
        <input type="text" id="title" placeholder="उदा. कक्षा 9 गणित - प्रश्नावली 2.1" required>
      </div>

      <div class="form-group">
        <label for="description">विवरण (निर्देश):</label>
        <textarea id="description" placeholder="सवाल नंबर 1 से 5 हल करें..." required></textarea>
      </div>

      <div class="form-group">
        <label for="imageFile">फ़ोटो जोड़ें (वैकल्पिक):</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>

      <button type="submit" id="submitBtn">होमवर्क पोस्ट करें</button>
    </form>
  </div>

  <!-- लाइव होमवर्क की सूची (बच्चों और पालकों के लिए) -->
  <div class="card">
    <h2>दिए गए होमवर्क</h2>
    <div id="homework-list">लोड हो रहा है...</div>
  </div>

  <!-- Firebase और डेटाबेस स्क्रिप्ट -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
      apiKey: "AIzaSyCUfzpo3_JTxMECkbRT",
      authDomain: "digital-suman-16.firebaseapp.com",
      projectId: "digital-suman-16",
      storageBucket: "digital-suman-16.firebasestorage.app",
      messagingSenderId: "9523225964",
      appId: "1:9523225964:web:8a6c393d",
      measurementId: "G-8WHH1SPEPY"
    };

    // डेटाबेस इनिशियलाइज़ करें
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("homeworkForm");
    const submitBtn = document.getElementById("submitBtn");
    const listContainer = document.getElementById("homework-list");

    // फॉर्म सबमिट हैंडलर
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "सेव हो रहा है...";

      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const fileInput = document.getElementById("imageFile");

      let imageBase64 = "";

      // फ़ोटो को बिना किसी खर्चे के डेटाबेस में सुरक्षित रखने के लिए बेस64 में बदलना
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        imageBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      try {
        await addDoc(collection(db, "homework"), {
          title: title,
          description: description,
          image: imageBase64,
          createdAt: serverTimestamp()
        });

        alert("होमवर्क सफलतापूर्वक पोस्ट हो गया!");
        form.reset();
      } catch (err) {
        console.error("Error: ", err);
        alert("त्रुटि आई: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "होमवर्क पोस्ट करें";
      }
    });

    // रीयल-टाइम में डेटा लोड करना
    const q = query(collection(db, "homework"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        listContainer.innerHTML = "<p>अभी कोई होमवर्क उपलब्ध नहीं है।</p>";
        return;
      }

      listContainer.innerHTML = "";
      snapshot.forEach((doc) => {
        const item = doc.data();
        const div = document.createElement("div");
        div.className = "homework-item";

        let dateStr = "";
        if (item.createdAt && item.createdAt.toDate) {
          dateStr = item.createdAt.toDate().toLocaleString("hi-IN");
        }

        div.innerHTML = `
          <h3>${item.title || "होमवर्क"}</h3>
          <p>${item.description || ""}</p>
          ${item.image ? `<img src="${item.image}" alt="होमवर्क चित्र" />` : ""}
          ${dateStr ? `<span class="timestamp">दिनांक: ${dateStr}</span>` : ""}
        `;
        listContainer.appendChild(div);
      });
    }, (error) => {
      console.error("डेटा लोड करने में त्रुटि: ", error);
      listContainer.innerHTML = "<p>डेटा लोड करने में समस्या आई। कृपया इंटरनेट चेक करें।</p>";
    });
  </script>
</body>
</html>
