
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1746a2">
<title>Digital Suman 16</title>

<style>
:root{
  --blue:#1746a2;
  --light:#edf3ff;
  --white:#fff;
  --text:#18243b;
  --muted:#718096;
  --border:#e5eaf2;
  --red:#dc3545;
}
*{box-sizing:border-box}
body{
  margin:0;background:#f4f6fb;color:var(--text);
  font-family:system-ui,"Noto Sans Devanagari",sans-serif;
  font-size:15px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  background:var(--blue);color:white;padding:17px 16px;
  position:sticky;top:0;z-index:5;
}
.header-row{display:flex;align-items:center;justify-content:space-between}
header h2{margin:0;font-size:20px}
header small{opacity:.85}
#app{max-width:760px;margin:auto;padding:15px 13px 90px}
.card{
  background:white;border:1px solid var(--border);
  border-radius:13px;padding:16px;margin-bottom:13px;
}
h3{margin:0 0 12px;font-size:18px}
h4{margin:0 0 8px}
p{line-height:1.65}
.muted{color:var(--muted);font-size:13px}
button.primary{
  background:var(--blue);color:white;border:0;border-radius:9px;
  padding:11px 16px;font-weight:600;
}
button.secondary{
  background:var(--light);color:var(--blue);border:0;
  padding:10px 14px;border-radius:9px;
}
button.danger{
  background:#fff0f0;color:var(--red);border:0;
  border-radius:8px;padding:8px 11px;
}
input,textarea,select{
  width:100%;padding:11px;border:1px solid #dce2ed;
  border-radius:9px;background:white;color:var(--text);
  margin:6px 0 13px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{min-height:95px;resize:vertical}
label{font-weight:600;font-size:14px}
.hidden{display:none!important}
.center{text-align:center}
.tabs{
  position:fixed;bottom:0;left:0;right:0;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:white;border-top:1px solid var(--border);
  padding:7px 2px calc(7px + env(safe-area-inset-bottom));
  z-index:10;
}
.tab{
  border:0;background:transparent;color:#778399;
  font-size:11px;padding:5px 1px;
}
.tab span{display:block;font-size:20px;margin-bottom:3px}
.tab.active{color:var(--blue);font-weight:700}
.post-title{font-size:17px;font-weight:700;margin-bottom:6px}
.post-meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.post-body{white-space:pre-wrap;line-height:1.7}
.post-file{max-width:100%;border-radius:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{padding:9px 6px;border:1px solid var(--border);text-align:left}
th{background:var(--light);color:var(--blue)}
.period-row{
  border:1px solid var(--border);padding:10px;border-radius:9px;
  margin:9px 0;
}
.period-row input{margin-bottom:5px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-block;background:var(--light);color:var(--blue);
  padding:4px 9px;border-radius:20px;font-size:12px;
}
#toast{
  position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
  background:#17243b;color:white;padding:11px 18px;
  border-radius:9px;z-index:30;display:none;
  max-width:90%;text-align:center;
}
#loading{text-align:center;padding:30px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:25px 8px}
@media(min-width:600px){
  #app{padding-top:22px}
  .tabs{max-width:760px;left:50%;transform:translateX(-50%)}
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <h2>📚 Digital Suman 16</h2>
      <small>आपके विद्यालय का डिजिटल पोर्टल</small>
    </div>
    <span id="userBadge" class="badge hidden">छात्र</span>
  </div>
</header>

<main id="app">
  <div id="loading">लोड हो रहा है...</div>

  <!-- पहली बार का सेटअप -->
  <section id="setup" class="hidden">
    <div class="card center">
      <h3>🙏 Digital Suman 16 में आपका स्वागत है</h3>
      <p>कृपया बताएं, आप कौन हैं?</p>
      <button class="primary" style="width:100%;margin:7px 0"
        onclick="window.chooseRole('student')">
        👨‍🎓 मैं छात्र / पालक हूँ
      </button>
      <button class="secondary" style="width:100%;margin:7px 0"
        onclick="window.chooseRole('teacher')">
        👩‍🏫 मैं शिक्षक हूँ
      </button>
    </div>
  </section>

  <!-- कक्षा चयन -->
  <section id="classSetup" class="hidden">
    <div class="card">
      <h3>अपनी कक्षा चुनें</h3>
      <p class="muted">आपकी चुनी हुई कक्षा इस डिवाइस पर सेव रहेगी।</p>
      <div id="classButtons"></div>
    </div>
  </section>

  <!-- शिक्षक PIN -->
  <section id="teacherSetup" class="hidden">
    <div class="card">
      <h3>🔐 शिक्षक लॉगिन</h3>
      <label>6 अंकों का गुप्त PIN</label>
      <input id="teacherPin" type="password" inputmode="numeric"
        maxlength="6" placeholder="PIN दर्ज करें">
      <button class="primary" onclick="window.verifyTeacher()">
        लॉगिन करें
      </button>
    </div>
  </section>

  <!-- मुख्य पोर्टल -->
  <section id="portal" class="hidden">
    <div id="homeInfo" class="card">
      <h3>नमस्कार! 👋</h3>
      <p id="welcomeText" class="muted"></p>
    </div>

    <div id="contentArea"></div>
  </section>
</main>

<!-- नीचे के टैब -->
<nav id="bottomTabs" class="tabs hidden">
  <button class="tab active" onclick="window.openTab('homework',this)">
    <span>📝</span>होमवर्क
  </button>
  <button class="tab" onclick="window.openTab('syllabus',this)">
    <span>📖</span>सिलेबस
  </button>
  <button class="tab" onclick="window.openTab('timetable',this)">
    <span>🕒</span>टाइम-टेबल
  </button>
  <button class="tab" onclick="window.openTab('notice',this)">
    <span>📢</span>सूचना
  </button>
  <button class="tab" onclick="window.openTab('feedback',this)">
    <span>💬</span>सलाह
  </button>
</nav>

<div id="toast"></div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth, signInAnonymously
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase configuration */
const firebaseConfig = {
  apiKey: "AIzaSyCUfzpo3_JTxMECkbRT",
  authDomain: "digital-suman-16.firebaseapp.com",
  projectId: "digital-suman-16",
  storageBucket: "digital-suman-16.firebasestorage.app",
  messagingSenderId: "9523225964",
  appId: "1:9523225964:web:8a6c393d",
  measurementId: "G-8WHH1SPEPY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const CLASSES = [
  "9th A","9th B","9th C","10th A","10th B","11th","12th"
];

const PIN = "791632";
const STORE = "digital_suman_16_user";

let currentUser = null;
let currentTab = "homework";
let allPosts = [];
let allFeedback = [];
let unsubscribePosts = null;
let unsubscribeFeedback = null;
let periodCount = 0;

const TYPES = {
  homework:"होमवर्क",
  syllabus:"सिलेबस",
  timetable:"समय सारणी",
  notice:"सूचना"
};

const $ = id => document.getElementById(id);

function toast(message){
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>el.style.display="none",2800);
}

function showOnly(id){
  ["setup","classSetup","teacherSetup","portal"].forEach(x=>{
    $(x).classList.toggle("hidden",x!==id);
  });
}

function getSavedUser(){
  try{
    return JSON.parse(localStorage.getItem(STORE));
  }catch(e){return null}
}

function saveUser(user){
  localStorage.setItem(STORE,JSON.stringify(user));
  currentUser = user;
}

async function startFirebase(){
  try{
    await signInAnonymously(auth);
    return true;
  }catch(error){
    console.error(error);
    toast("Firebase लॉगिन नहीं हुआ। Authentication सेटिंग जांचें।");
    return false;
  }
}

async function initializePortal(){
  $("loading").classList.add("hidden");
  const saved = getSavedUser();

  if(saved && (saved.role==="teacher" ||
      (saved.role==="student" && CLASSES.includes(saved.className)))){
    currentUser = saved;
    await enterPortal();
  }else{
    showOnly("setup");
  }
}

/* Role selection */
window.chooseRole = function(role){
  if(role==="student"){
    showOnly("classSetup");
    $("classButtons").innerHTML = CLASSES.map(c=>`
      <button class="secondary" style="width:100%;margin:5px 0"
        onclick="window.selectClass('${c}')">${c}</button>
    `).join("");
  }else{
    showOnly("teacherSetup");
  }
};

window.selectClass = async function(className){
  if(!CLASSES.includes(className))return;
  saveUser({role:"student",className});
  await enterPortal();
};

window.verifyTeacher = async function(){
  if($("teacherPin").value !== PIN){
    toast("गलत PIN! कृपया दोबारा कोशिश करें।");
    $("teacherPin").value="";
    return;
  }
  saveUser({role:"teacher"});
  await enterPortal();
};

/* Open portal */
async function enterPortal(){
  const success = await startFirebase();
  if(!success)return;

  showOnly("portal");
  $("bottomTabs").classList.remove("hidden");
  $("userBadge").classList.remove("hidden");

  const teacher = currentUser.role==="teacher";
  $("userBadge").textContent = teacher ? "👩‍🏫 शिक्षक" :
    "🎓 "+currentUser.className;

  $("welcomeText").textContent = teacher ?
    "शिक्षक मोड में आपका स्वागत है।" :
    currentUser.className+" के विद्यार्थी के लिए आपका पोर्टल।";

  listenPosts();

  if(teacher)listenFeedback();
  else if(unsubscribeFeedback){
    unsubscribeFeedback();
    unsubscribeFeedback=null;
  }

  openTab(currentTab);
}

/* Firestore listeners */
function listenPosts(){
  if(unsubscribePosts)unsubscribePosts();

  const q = query(collection(db,"posts"),orderBy("createdAt","desc"));

  unsubscribePosts = onSnapshot(q,snapshot=>{
    allPosts = snapshot.docs.map(d=>({id:d.id,...d.data()}));
    renderTab();
  },error=>{
    console.error(error);
    toast("पोस्ट लोड नहीं हुई। Firestore Rules जांचें।");
  });
}

function listenFeedback(){
  if(unsubscribeFeedback)unsubscribeFeedback();

  const q = query(collection(db,"feedback"),orderBy("createdAt","desc"));

  unsubscribeFeedback = onSnapshot(q,snapshot=>{
    allFeedback = snapshot.docs.map(d=>({id:d.id,...d.data()}));
    if(currentTab==="feedback")renderTab();
  },error=>{
    console.error(error);
    toast("संदेश लोड नहीं हुए।");
  });
}

/* Tabs */
window.openTab = function(tab,button){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  if(button)button.classList.add("active");
  else{
    const buttons=document.querySelectorAll(".tab");
    const index=["homework","syllabus","timetable","notice","feedback"].indexOf(tab);
    if(index>=0)buttons[index].classList.add("active");
  }
  renderTab();
};

function renderTab(){
  if(!currentUser)return;
  const area=$("contentArea");
  const teacher=currentUser.role==="teacher";

  if(currentTab==="feedback"){
    area.innerHTML=teacher ? renderTeacherFeedback() : renderFeedbackForm();
    return;
  }

  const posts=allPosts.filter(p=>
    p.type===currentTab &&
    (teacher || p.className==="सभी कक्षाओं के लिए" ||
      p.className===currentUser.className)
  );

  area.innerHTML=`
    ${teacher ? `<div class="card">
      <button class="primary" style="width:100%"
        onclick="window.showPostForm()">＋ नया पोस्ट करें</button>
    </div>`:""}
    <div id="postFormArea"></div>
    <h3>${TYPES[currentTab]}</h3>
    ${posts.length ? posts.map(renderPost).join("") :
      `<div class="card empty">📭 अभी कोई पोस्ट उपलब्ध नहीं है।</div>`}
  `;
}

function renderPost(post){
  const teacher=currentUser.role==="teacher";
  let attachment="";

  if(post.fileData){
    if(post.fileType && post.fileType.startsWith("image/")){
      attachment=`<a href="${post.fileData}" target="_blank">
        <img class="post-file" src="${post.fileData}" alt="संलग्न फोटो">
      </a>`;
    }else{
      attachment=`<p>📎 <a href="${post.fileData}" download="${escapeHTML(post.fileName||"document")}">
        ${escapeHTML(post.fileName||"फ़ाइल देखें")}</a></p>`;
    }
  }

  let timetable="";
  if(post.type==="timetable" && Array.isArray(post.periods)){
    timetable=`
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>पीरियड</th><th>समय</th><th>विषय</th><th>शिक्षक</th></tr></thead>
        <tbody>${post.periods.map(p=>`
          <tr>
            <td>${escapeHTML(p.number)}</td>
            <td>${escapeHTML(p.time)}</td>
            <td>${escapeHTML(p.subject)}</td>
            <td>${escapeHTML(p.teacher)}</td>
          </tr>`).join("")}</tbody>
      </table></div>`;
  }

  return `<article class="card">
    <div class="post-meta">
      <span class="badge">${escapeHTML(post.className||"")}</span>
      ${escapeHTML(post.typeLabel||TYPES[post.type]||"")}
      · ${formatDate(post.createdAt)}
    </div>
    <div class="post-title">${escapeHTML(post.title||"बिना शीर्षक")}</div>
    <div class="post-body">${escapeHTML(post.description||"")}</div>
    ${timetable}
    ${attachment}
    ${teacher ? `<div style="margin-top:13px">
      <button class="danger" onclick="window.deletePost('${post.id}')">🗑 पोस्ट हटाएं</button>
    </div>`:""}
  </article>`;
}

/* Post form */
window.showPostForm = function(){
  const area=$("postFormArea");
  if(!area)return;

  area.innerHTML=`
  <div class="card">
    <h3>नया पोस्ट बनाएं</h3>

    <label>पोस्ट का प्रकार</label>
    <select id="postType" onchange="window.changePostType()">
      <option value="homework">होमवर्क</option>
      <option value="syllabus">सिलेबस</option>
      <option value="timetable">समय सारणी</option>
      <option value="notice">सूचना</option>
    </select>

    <label>कक्षा</label>
    <select id="postClass">
      <option>सभी कक्षाओं के लिए</option>
      ${CLASSES.map(c=>`<option>${c}</option>`).join("")}
    </select>

    <label>शीर्षक</label>
    <input id="postTitle" maxlength="150" placeholder="पोस्ट का शीर्षक">

    <label>विवरण</label>
    <textarea id="postDescription" maxlength="5000"
      placeholder="यहाँ पूरी जानकारी लिखें"></textarea>

    <div id="periodEditor" class="hidden">
      <label>समय सारणी के पीरियड</label>
      <div id="periodRows"></div>
      <button class="secondary" onclick="window.addPeriod()">＋ पीरियड जोड़ें</button>
    </div>

    <label style="display:block;margin-top:13px">फ़ोटो या PDF (अधिकतम 700 KB)</label>
    <input type="file" id="postFile" accept="image/*,application/pdf">

    <div class="form-actions">
      <button class="primary" onclick="window.publishPost()">पोस्ट प्रकाशित करें</button>
      <button class="secondary" onclick="window.cancelPost()">रद्द करें</button>
    </div>
    <p class="muted">ध्यान दें: फ़ाइल Firestore में Base64 के रूप में सेव होगी।</p>
  </div>`;

  periodCount=0;
  window.changePostType();
};

window.changePostType=function(){
  const isTable=$("postType").value==="timetable";
  $("periodEditor").classList.toggle("hidden",!isTable);
  if(isTable && periodCount===0)window.addPeriod();
};

window.addPeriod=function(){
  periodCount++;
  const n=periodCount;
  const row=document.createElement("div");
  row.className="period-row";
  row.id="period_"+n;
  row.innerHTML=`
    <b>पीरियड ${n}</b>
    <input class="period-number" placeholder="पीरियड नंबर" value="${n}">
    <input class="period-time" placeholder="समय (जैसे 9:00 - 9:45)">
    <input class="period-subject" placeholder="विषय">
    <input class="period-teacher" placeholder="शिक्षक का नाम">
    <button class="danger" onclick="this.parentElement.remove()">हटाएं</button>
  `;
  $("periodRows").appendChild(row);
};

window.cancelPost=function(){
  $("postFormArea").innerHTML="";
};

window.publishPost=async function(){
  if(currentUser.role!=="teacher")return toast("अनुमति नहीं है।");

  const type=$("postType").value;
  const title=$("postTitle").value.trim();
  const description=$("postDescription").value.trim();
  const className=$("postClass").value;

  if(!title)return toast("कृपया शीर्षक लिखें।");
  if(!description && type!=="timetable")return toast("विवरण लिखें।");

  let periods=[];
  if(type==="timetable"){
    periods=[...document.querySelectorAll(".period-row")].map(row=>({
      number:row.querySelector(".period-number").value.trim(),
      time:row.querySelector(".period-time").value.trim(),
      subject:row.querySelector(".period-subject").value.trim(),
      teacher:row.querySelector(".period-teacher").value.trim()
    })).filter(p=>p.number||p.time||p.subject||p.teacher);

    if(!periods.length)return toast("कम से कम एक पीरियड जोड़ें।");
  }

  const file=$("postFile").files[0];
  let fileData=null,fileName="",fileType="";

  if(file){
    if(file.size>700*1024)return toast("फ़ाइल 700 KB से छोटी रखें।");
    if(!file.type.startsWith("image/") && file.type!=="application/pdf")
      return toast("केवल फोटो या PDF स्वीकार है।");

    try{
      fileData=await readFile(file);
      fileName=file.name;
      fileType=file.type;
    }catch(e){return toast("फ़ाइल पढ़ने में समस्या हुई।");}
  }

  try{
    await addDoc(collection(db,"posts"),{
      type,typeLabel:TYPES[type],className,title,description,
      periods,fileData,fileName,fileType,
      createdAt:serverTimestamp()
    });
    toast("पोस्ट सफलतापूर्वक प्रकाशित हुई।");
    $("postFormArea").innerHTML="";
  }catch(error){
    console.error(error);
    toast("पोस्ट नहीं हुई। Firebase Rules जांचें।");
  }
};

function readFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* Delete post */
window.deletePost=async function(id){
  if(currentUser.role!=="teacher")return;
  if(!confirm("क्या आप यह पोस्ट हटाना चाहते हैं?"))return;

  try{
    await deleteDoc(doc(db,"posts",id));
    toast("पोस्ट हटा दी गई।");
  }catch(error){
    console.error(error);
    toast("पोस्ट हटाने में समस्या हुई।");
  }
};

/* Student feedback form */
function renderFeedbackForm(){
  return `
    <div class="card">
      <h3>💬 सलाह / समस्या भेजें</h3>
      <p class="muted">आपकी बात शिक्षक तक पहुँचाई जाएगी। अपना नाम देना वैकल्पिक है।</p>

      <label>आपका नाम (वैकल्पिक)</label>
      <input id="feedbackName" maxlength="80" placeholder="गुमनाम भी भेज सकते हैं">

      <label>समस्या का प्रकार</label>
      <select id="feedbackType">
        <option value="पढ़ाई से संबंधित">पढ़ाई से संबंधित</option>
        <option value="होमवर्क">होमवर्क</option>
        <option value="शिक्षक से संबंधित">शिक्षक से संबंधित</option>
        <option value="विद्यालय सुविधा">विद्यालय सुविधा</option>

/* Send private feedback */
window.sendFeedback=async function(){
  if(currentUser.role!=="student")return;

  const name=$("feedbackName").value.trim();
  const type=$("feedbackType").value;
  const message=$("feedbackMessage").value.trim();

  if(!message)return toast("कृपया अपना संदेश लिखें।");

  try{
    await addDoc(collection(db,"feedback"),{
      name:name||"गुमनाम",
      type,message,
      className:currentUser.className,
      createdAt:serverTimestamp()
    });
    $("feedbackMessage").value="";
    $("feedbackName").value="";
    toast("आपका संदेश शिक्षक को भेज दिया गया है।");
  }catch(error){
    console.error(error);
    toast("संदेश नहीं भेजा गया। Firebase Rules जांचें।");
  }
};
